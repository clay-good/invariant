[advisories]
version = 2
yanked = "warn"
unmaintained = "workspace"
ignore = [
    # chrono is flagged unmaintained (informational, no patched version).
    # It is used across the workspace; migrating to jiff or time is tracked
    # as a follow-up. Remove this entry once chrono is gone.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; migration to jiff/time pending" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]

[[licenses.clarify]]
name = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
